version: '3.8'

services:
  # The actual API. Talks to PostgreSQL on Supabase (external, managed --
  # DATABASE_URL in .env), not a local Postgres container.
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: nexustrace-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  # React (Vite) build, served by Nginx. Its nginx config proxies /api/ to
  # http://backend:8000/ -- that only resolves because this service is
  # named "backend" on the compose network, so don't rename it without
  # updating frontend/nexustrace-react-v3/Dockerfile too.
  frontend:
    build:
      context: ./frontend/nexustrace-react-v3
      dockerfile: Dockerfile
    container_name: nexustrace-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional secondary graph mirror -- pipeline/graph/build_graph.py loads
  # into this if it's reachable and silently skips it if not. The app's
  # real, required data store is PostgreSQL (Supabase, external) via
  # DATABASE_URL above; this container is not required for anything to
  # work. Included only for anyone who wants to explore the graph in
  # Neo4j's own browser console at http://localhost:7474.
  neo4j:
    image: neo4j:5-community
    container_name: nexustrace-neo4j
    profiles: ["neo4j"]  # only starts with `docker compose --profile neo4j up`
    ports:
      - "7474:7474" # HTTP Web Console
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["graph-data-science"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
