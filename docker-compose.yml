version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: nexustrace-neo4j
    ports:
      - "7474:7474" # HTTP Web Console
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["graph-data-science"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
